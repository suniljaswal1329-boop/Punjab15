<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search History</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{font-family:Arial;background:#fef9c3;margin:0;padding:15px;text-align:center}.card{background:#fff;padding:20px;border-radius:20px;max-width:500px;margin:15px auto;box-shadow:0 4px 15px rgba(0,0,0,.1)}input{padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px}.btn{background:#111827;color:#fff;border:0;padding:10px 20px;border-radius:10px;font-size:16px;cursor:pointer}table{width:100%;background:#fff;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee}.wrap{max-width:500px;margin:0 auto}</style>
</head>
<body>
<div class="wrap"><h2>🗓️ Search History</h2><div class="card"><input type="date" id="dateInput"><button class="btn" onclick="doSearch()">Search</button></div><table><tr><th>Date</th><th>Time</th><th>A</th><th>B</th><th>C</th></tr><tbody id="list"></tbody></table><br><a href="index.html">← Back to Live</a></div>
<script>
const cfg={apiKey:"AIzaSyAYINd0kww95bYvwRzjio8uabSuuXsLO1o",authDomain:"superlotto.firebaseapp.com",databaseURL:"https://superlotto-default-rtdb.firebaseio.com",projectId:"superlotto",storageBucket:"superlotto.firebasestorage.app",messagingSenderId:"851670105901",appId:"1:851670105901:web:568c45b226b7c80f1d1da4"};
firebase.initializeApp(cfg);let db=firebase.database(); let p=n=>String(n).padStart(2,'0');
let dk=t=>{let d=new Date(t);return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
function toMin(t){ if(!t) return 0; let parts=t.split(' '); let tm=parts[0].split(':'); let h=parseInt(tm[0]), m=parseInt(tm[1]), ap=parts[1]; if(ap=='PM' && h!=12) h+=12; if(ap=='AM' && h==12) h=0; return h*60+m; }
function doSearch(){ let date=document.getElementById('dateInput').value; if(!date) return alert('Date select karo'); db.ref('results').once('value',s=>{ let arr=[]; s.forEach(x=>{let r=x.val(); let rdate = r.dateKey || dk(r.time); if(rdate==date) arr.push(r);}); arr.sort((x,y)=>toMin(y.timeLabel)-toMin(x.timeLabel)); let h=''; arr.forEach(r=>{ h+=`<tr><td>${r.dateKey||dk(r.time)}</td><td>${r.timeLabel}</td><td>${p(r.a)}</td><td>${p(r.b)}</td><td>${p(r.c)}</td></tr>`;}); list.innerHTML=h||'<tr><td colspan="5">No Result Found</td></tr>'; });}
let now=new Date(); let today=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate()); document.getElementById('dateInput').value=today; doSearch();
</script>
</body>
</html>
