<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUNJAB 15</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
.header{background:#ffcc00;padding:15px;text-align:center}
.header h1{color:#000;font-size:26px;font-weight:900}
.container{max-width:500px;margin:0 auto;padding:15px}
.box{background:#111;border:2px solid #ffcc00;border-radius:12px;padding:20px;margin:12px 0;text-align:center}
.big{font-size:90px;font-weight:900;color:#ffcc00;margin:5px 0}
.date{color:#aaa;font-size:16px;margin-top:5px}
.timer{font-size:22px;font-weight:700;color:#fff;background:#222;padding:10px;border-radius:8px;margin-top:10px}
.timer span{color:#ffcc00}
input{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:none;background:#222;color:#fff;font-size:18px;text-align:center}
button{width:100%;padding:14px;background:#ffcc00;border:none;border-radius:8px;font-size:18px;font-weight:900;color:#000}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{background:#ffcc00;color:#000;padding:8px}
td{background:#222;padding:8px;text-align:center;border-bottom:1px solid #333}
</style>
</head>
<body>
<div class="header"><h1>PUNJAB 15 - LIVE</h1></div>
<div class="container">

<div class="box">
<h2>LIVE RESULT</h2>
<div class="big" id="live">--</div>
<div class="date" id="todayDate">--</div>
<div class="timer">Next Result: <span id="timer">--:--:--</span></div>
</div>

<div class="box">
<h3>10 DAYS RECORD</h3>
<table><tr><th>DATE</th><th>RESULT</th></tr><tbody id="hist"></tbody></table>
</div>

<div class="box" style="border-color:#444">
<h3>ADMIN PANEL</h3>
<input type="password" id="pass" placeholder="Password = 1329">
<input type="text" id="res" placeholder="Result likho (00-99)">
<button onclick="update()">UPDATE RESULT</button>
</div>

</div>

<script>
// --- DATA SAVE ---
let current = localStorage.getItem('punjab_live') || '--';
let history = JSON.parse(localStorage.getItem('punjab_hist') || '[]');
document.getElementById('live').innerText = current;

function render(){
let h=document.getElementById('hist');h.innerHTML='';
history.slice().reverse().slice(0,10).forEach(r=>{
h.innerHTML+=`<tr><td>${r.d}</td><td style="color:#ffcc00;font-weight:900">${r.n}</td></tr>`;
});
}
render();

// --- DATE ---
function updateDate(){
let now=new Date();
let options={weekday:'long',year:'numeric',month:'long',day:'numeric'};
document.getElementById('todayDate').innerText=now.toLocaleDateString('hi-IN',options);
}
updateDate();

// --- TIMER - Next result at 5 PM daily ---
function updateTimer(){
let now=new Date();
let target=new Date();
target.setHours(17,0,0,0); // 5 PM
if(now>target){target.setDate(target.getDate()+1);}
let diff=target-now;
let h=Math.floor(diff/1000/60/60);
let m=Math.floor(diff/1000/60%60);
let s=Math.floor(diff/1000%60);
document.getElementById('timer').innerText=
(h<10?'0'+h:h)+":"+(m<10?'0'+m:m)+":"+(s<10?'0'+s:s);
}
setInterval(updateTimer,1000);
updateTimer();

// --- UPDATE ---
function update(){
let p=document.getElementById('pass').value;
let n=document.getElementById('res').value;
if(p!=="1329"){alert("Password galat! 1329 likho");return;}
if(!n){alert("Result likho");return;}
let d=new Date().toLocaleDateString('hi-IN');
localStorage.setItem('punjab_live',n);
history.push({n:n,d:d});
localStorage.setItem('punjab_hist',JSON.stringify(history));
document.getElementById('live').innerText=n;
document.getElementById('todayDate').innerText=new Date().toLocaleDateString('hi-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
render();
alert("Updated: "+n);
document.getElementById('res').value='';
}
</script>
</body>
</html>
