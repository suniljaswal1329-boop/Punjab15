<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER LOTTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;padding:12px;font-family:Arial;max-width:500px;margin:auto;color:#fff}
.h{background:#000;border:3px solid #facc15;border-radius:20px;text-align:center;padding:24px;margin-bottom:12px}
.h h1{color:#facc15;font-size:48px}
.b{display:inline-flex;width:70px;height:70px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-weight:900;font-size:30px;margin:5px}
.box{background:#fff;color:#000;border-radius:20px;padding:16px;margin-bottom:12px;text-align:center}
input{width:100%;padding:16px;border-radius:12px;border:2px solid #ddd;text-align:center;font-weight:700}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee;align-items:center}
</style>
</head>
<body>

<div class="h"><h1>SUPER LOTTO</h1><div style="color:#aaa;margin-top:6px">PUNJAB STATE FAST RESULT</div></div>

<div class="box">
<div style="font-size:12px;color:#666">NEXT DRAW IN</div>
<b id="timer" style="font-size:50px">00:00:00</b>
<div>Next: <span id="slot">--:--</span> | <span id="date">--/--/----</span></div>
</div>

<div class="box">
<div id="liveDate">--</div>
<div id="liveBalls"></div>
</div>

<div class="box"><input id="s" placeholder="Search History" onkeyup="search()"></div>

<div class="box"><div style="text-align:left;font-weight:800">Today - <span id="c">0</span> draws</div><div id="list"></div></div>

<script>
// SIMPLE TIMER - YEH PAKKA CHALEGA
function runTimer(){
let now = new Date();
let m = now.getMinutes();
let fixed = Math.floor(m/15)*15;
let d = new Date(now);
d.setMinutes(fixed);
d.setSeconds(0);
let next = new Date(d);
next.setMinutes(next.getMinutes()+15);
let diff = Math.floor((next - now)/1000);
if(diff<0) diff=0;
let mm = Math.floor(diff/60);
let ss = diff%60;
document.getElementById('timer').innerText = "00:" + String(mm).padStart(2,'0') + ":" + String(ss).padStart(2,'0');
let hh = next.getHours();
let ap = hh>=12?'PM':'AM';
let hr = hh%12||12;
document.getElementById('slot').innerText = String(hr).padStart(2,'0')+":"+String(next.getMinutes()).padStart(2,'0')+" "+ap;
document.getElementById('date').innerText = String(d.getDate()).padStart(2,'0')+"/"+String(d.getMonth()+1).padStart(2,'0')+"/"+d.getFullYear();
}
setInterval(runTimer,1000);
runTimer();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyBmWl4dDF4pXbdBZ-YVYLrYWrFgDYDbGCE",authDomain:"punjab15-1329.firebaseapp.com",databaseURL:"https://punjab15-1329-default-rtdb.firebaseio.com",projectId:"punjab15-1329",storageBucket:"punjab15-1329.firebasestorage.app",messagingSenderId:"586224821147",appId:"1:586224821147:web:d8f55f83372f5d6dd1773e"};
const app=initializeApp(cfg);const db=getDatabase(app);let all=[];
onValue(ref(db,'live/result'),s=>{let v=s.val();if(!v)return;document.getElementById('liveDate').innerText=v.date+" "+v.time;document.getElementById('liveBalls').innerHTML=`<span class="b" style="background:#ef4444">${v.a}</span><span class="b" style="background:#a855f7">${v.b}</span><span class="b" style="background:#22c55e">${v.c}</span>`;});
onValue(ref(db,'history'),s=>{all=[];s.forEach(c=>all.push(c.val()));all.sort((a,b)=>b.timestamp-a.timestamp);show(all);});
window.show=l=>{let h=document.getElementById('list');h.innerHTML="";document.getElementById('c').innerText=l.length;if(l.length==0){h.innerHTML="No results yet";return;}l.forEach(r=>{h.innerHTML+=`<div class="row"><div>${r.date} ${r.time}</div><div><span class="b" style="width:40px;height:40px;font-size:16px;background:#ef4444">${r.a}</span><span class="b" style="width:40px;height:40px;font-size:16px;background:#a855f7">${r.b}</span><span class="b" style="width:40px;height:40px;font-size:16px;background:#22c55e">${r.c}</span></div></div>`;});};
window.search=()=>{let q=document.getElementById('s').value.toLowerCase();if(!q)return show(all);show(all.filter(r=>(r.date+r.time+r.a+r.b+r.c).toLowerCase().includes(q)));};
</script>

</body>
</html>
