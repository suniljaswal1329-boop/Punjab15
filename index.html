<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUNJAB15</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial Black;margin:0}
img{width:100%;max-width:420px;border:3px solid gold;border-radius:15px;margin:15px auto;display:block}
.h{background:gold;color:#000;padding:12px;font-size:20px}
.box{border:3px solid gold;margin:15px;padding:15px;border-radius:15px;background:#111}
#cd{font-size:55px;background:gold;color:#000;padding:10px;border-radius:12px;margin:10px}
#nt{font-size:22px;margin:5px}
.rb{display:inline-flex;flex-direction:column;justify-content:center;background:gold;color:#000;width:90px;height:90px;border-radius:12px;margin:5px}
.rb span{font-size:32px}
.hist{margin:15px;border:1px solid #333;border-radius:10px;padding:10px;background:#0a0a0a;text-align:left;font-family:Arial;font-size:13px}
.hi{border-bottom:1px solid #222;padding:8px 0;display:flex;justify-content:space-between}
</style>
</head>
<body>
<img src="IMG-20261001-WA8057.jpg">
<div class="h">🏆 PUNJAB 15 LIVE 🏆</div>
<div class="box">
<div id="cd">--:--</div>
<div id="nt">--:-- BAJE</div>
<div style="margin:10px 0"><div class="rb">A=<span id="a">--</span></div><div class="rb">B=<span id="b">--</span></div><div class="rb">C=<span id="c">--</span></div></div>
<div style="color:#aaa;font-family:Arial;font-size:12px">Live: <span id="lt"></span></div>
</div>
<div class="hist"><div style="color:gold;font-family:Arial Black">📋 TODAY RECORD (Time ke saath)</div><div id="hl">Loading...</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const c={apiKey:"AIzaSyBmWl4dDF4pXbdBZ-YVYLrYWrFgDYDbGCE",authDomain:"punjab15-1329.firebaseapp.com",databaseURL:"https://punjab15-1329-default-rtdb.firebaseio.com",projectId:"punjab15-1329",storageBucket:"punjab15-1329.firebasestorage.app",messagingSenderId:"586224821147",appId:"1:586224821147:web:d8f55f83372f5d6dd1773e"};
const a=initializeApp(c),db=getDatabase(a);
function u(){let n=new Date(),m=n.getMinutes(),s=n.getSeconds(),nm=Math.ceil((m+1)/15)*15;if(nm>=60)nm=0;let d=(nm-m-1)*60+(60-s);if(d<0)d+=3600;document.getElementById('cd').innerText=String(Math.floor(d/60)).padStart(2,'0')+":"+String(d%60).padStart(2,'0');let nh=n.getHours();if(nm==0)nh++;if(nh>=24)nh=0;let ap=nh>=12?'pm':'am',hh=nh%12||12;document.getElementById('nt').innerText=hh+":"+String(nm).padStart(2,'0')+" "+ap+" BAJE";document.getElementById('lt').innerText=n.toLocaleTimeString('en-IN')}setInterval(u,1000);u();
onValue(ref(db,'live/result'),s=>{let d=s.val();if(!d)return;document.getElementById('a').innerText=d.a;document.getElementById('b').innerText=d.b;document.getElementById('c').innerText=d.c});
onValue(ref(db,'history'),s=>{let e=document.getElementById('hl'),d=s.val();if(!d)return;let v=Object.values(d).reverse(),h="";v.slice(0,40).forEach(i=>{h+=`<div class=hi><span><b>A=${i.a} B=${i.b} C=${i.c}</b></span><span style="color:#aaa">${i.time||""} ${i.date||""}</span></div>`});e.innerHTML=h});
</script>
</body>
</html>
