<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUNJAB 15</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}.header{background:#ffcc00;padding:15px;text-align:center}.header h1{color:#000;font-size:26px;font-weight:900}.container{max-width:500px;margin:0 auto;padding:15px}.box{background:#111;border:2px solid #ffcc00;border-radius:12px;padding:20px;margin:12px 0;text-align:center}.big{font-size:90px;font-weight:900;color:#ffcc00}.date{color:#aaa;font-size:15px;margin-top:5px}.timer{font-size:22px;font-weight:700;background:#222;padding:12px;border-radius:8px;margin-top:10px}.timer span{color:#ffcc00;font-size:26px}.status{color:#0f0;font-size:14px;margin-top:5px}table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#ffcc00;color:#000;padding:8px}td{background:#222;padding:8px;text-align:center;border-bottom:1px solid #333}</style></head><body><div class="header"><h1>PUNJAB 15 - LIVE</h1><p style="color:#000;font-weight:700">9 AM - 9 PM | 15 MIN RESULT</p></div><div class="container"><div class="box"><h2>LIVE RESULT</h2><div class="big" id="live">--</div><div class="date" id="todayDate">--</div><div class="timer">Next in: <span id="timer">--:--</span></div><div class="status" id="status"></div></div><div class="box"><h3>TODAY RECORD</h3><table><tr><th>TIME</th><th>RESULT</th></tr><tbody id="hist"></tbody></table></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyBmWl4dDF4pXbdBZ-YVYLrYWrFgDYDbGCE",authDomain:"punjab15-1329.firebaseapp.com",databaseURL:"https://punjab15-1329-default-rtdb.firebaseio.com",projectId:"punjab15-1329",storageBucket:"punjab15-1329.firebasestorage.app",messagingSenderId:"586224821147",appId:"1:586224821147:web:d8f55f83372f5d6dd1773e"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);onValue(ref(db,'live/result'),s=>{let d=s.val();if(d)document.getElementById('live').innerText=d.number;});onValue(ref(db,'history'),s=>{let d=s.val();let h=document.getElementById('hist');h.innerHTML="";if(d){Object.values(d).reverse().slice(0,24).forEach(r=>{h.innerHTML+=`<tr><td>${r.time}</td><td style="color:#ffcc00;font-weight:900">${r.number}</td></tr>`;});}});function updateDate(){let now=new Date();document.getElementById('todayDate').innerText=now.toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+" | "+now.toLocaleTimeString('hi-IN');}setInterval(updateDate,1000);updateDate();function getNextSlot(){let now=new Date();let next=new Date(now);let mins=now.getMinutes();let nextMins=Math.ceil((mins+1)/15)*15;if(nextMins>=60){next.setHours(now.getHours()+1);next.setMinutes(0);}else{next.setMinutes(nextMins);}next.setSeconds(0);return next;}function updateTimer(){let now=new Date();let h=now.getHours();let status=document.getElementById('status');let timerEl=document.getElementById('timer');if(h<9){let t=new Date();t.setHours(9,0,0,0);let diff=t-now;let mm=Math.floor(diff/60000);let ss=Math.floor(diff/1000%60);timerEl.innerText=(mm<10?'0'+mm:mm)+":"+(ss<10?'0'+ss:ss);status.innerText="Market 9 AM ko open hoga";status.style.color="#ffcc00";return;}if(h>=21){let t=new Date();t.setDate(t.getDate()+1);t.setHours(9,0,0,0);let diff=t-now;let hh=Math.floor(diff/3600000);let mm=Math.floor(diff%3600000/60000);timerEl.innerText=hh+"h "+mm+"m";status.innerText="Market band - Kal 9 AM open";status.style.color="#f55";return;}let next=getNextSlot();let diff=next-now;let m=Math.floor(diff/60000);let s=Math.floor(diff%60000/1000);timerEl.innerText=(m<10?'0'+m:m)+":"+(s<10?'0'+s:s);status.innerText="Live - Next: "+next.toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'});status.style.color="#0f0";}setInterval(updateTimer,1000);updateTimer();</script></body></html>
