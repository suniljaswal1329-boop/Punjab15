<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperLotto Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#fef9c3;margin:0;padding:15px;text-align:center}
h1{font-size:32px}
.card{background:#fff;padding:20px;border-radius:20px;max-width:500px;margin:20px auto;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.auto{background:#ede9fe;padding:10px;border-radius:10px;font-weight:bold;margin:10px 0;font-size:18px}
input{padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px;width:80px;text-align:center;font-size:16px}
select{padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px;font-size:16px}
.btn{background:#111827;color:#fff;border:0;padding:10px 18px;border-radius:10px;font-size:16px;cursor:pointer;margin:5px}
.btn-green{background:#16a34a}
.edit{background:#a855f7;color:#fff;border:0;padding:8px 15px;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee}
</style>
</head>
<body>
<h1>SuperLotto Admin</h1>

<div class="card">
<h2>New Result Publish</h2>
<div class="auto" id="autoTime">Auto Time: --</div>
<input id="a" placeholder="A" type="number"><input id="b" placeholder="B" type="number"><input id="c" placeholder="C" type="number">
<br><button class="btn" onclick="publish()">Publish</button>
<button class="btn" onclick="cancelEdit()">Cancel Edit</button>
</div>

<div class="card" style="border:2px dashed #a855f7">
<h2>⏰ Missed Result Add Karo</h2>
<p style="color:#555;font-size:14px">Jo time chhoot gaya ho wo yahan se daalo</p>
<select id="missTime"></select>
<br>
<input id="ma" placeholder="A" type="number"><input id="mb" placeholder="B" type="number"><input id="mc" placeholder="C" type="number">
<br><button class="btn btn-green" onclick="publishMissed()">Add Missed Result</button>
</div>

<div class="card">
<h2>Today's Results - Edit</h2>
<table><tr><th>Time</th><th>A</th><th>B</th><th>C</th><th>Action</th></tr><tbody id="list"></tbody></table>
</div>

<script>
const cfg={apiKey:"AIzaSyAYINd0kww95bYvwRzjio8uabSuuXsLO1o",authDomain:"superlotto.firebaseapp.com",databaseURL:"https://superlotto-default-rtdb.firebaseio.com",projectId:"superlotto",storageBucket:"superlotto.firebasestorage.app",messagingSenderId:"851670105901",appId:"1:851670105901:web:568c45b226b7c80f1d1da4"};
firebase.initializeApp(cfg);let db=firebase.database();
let p=n=>String(n).padStart(2,'0');
let dk=t=>{let d=new Date(t);return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
let format12=(h,m)=>{let ap=h>=12?'PM':'AM';let hh=h%12;if(hh==0)hh=12;return hh+':'+p(m)+' '+ap;};
let editKey=null;

// Auto Time
function calcAuto(){
  let now=new Date(); let mins=now.getMinutes(); let next=Math.ceil((mins+1)/15)*15; let t=new Date(now);
  if(next>=60){t.setHours(t.getHours()+1);next=0} t.setMinutes(next,0,0);
  return format12(t.getHours(),t.getMinutes());
}
autoTime.textContent='Auto Time: '+calcAuto();
setInterval(()=>autoTime.textContent='Auto Time: '+calcAuto(),1000);

// Missed Time Dropdown - 8:45 AM to 10:00 PM
let sel=document.getElementById('missTime');
for(let h=8;h<=22;h++){
  for(let m=0;m<60;m+=15){
    if(h==8 && m<45) continue; if(h==22 && m>0) continue;
    let label=format12(h,m);
    let opt=document.createElement('option'); opt.value=label; opt.textContent=label; sel.appendChild(opt);
  }
}

function publish(){
  let a=+document.getElementById('a').value, b=+document.getElementById('b').value, c=+document.getElementById('c').value;
  if(isNaN(a)||isNaN(b)||isNaN(c)) return alert('A B C daalo');
  if(editKey){
    db.ref('results/'+editKey).update({a,b,c});
    db.ref('draw').set({a,b,c,timeLabel:document.getElementById('autoTime').textContent,time:Date.now()});
    alert('Edited');
    editKey=null;
  } else {
    let timeLabel=calcAuto(); let now=Date.now();
    db.ref('draw').set({a,b,c,timeLabel,time:now});
    db.ref('results').push({a,b,c,timeLabel,time:now,dateKey:dk(now)});
    alert('Published '+timeLabel);
  }
  document.getElementById('a').value='';document.getElementById('b').value='';document.getElementById('c').value='';
}

function publishMissed(){
  let a=+document.getElementById('ma').value, b=+document.getElementById('mb').value, c=+document.getElementById('mc').value;
  let timeLabel=sel.value;
  if(isNaN(a)||isNaN(b)||isNaN(c)) return alert('A B C daalo');
  let now=Date.now();
  db.ref('results').push({a,b,c,timeLabel,time:now,dateKey:dk(now)});
  alert('Missed Result Added: '+timeLabel);
  document.getElementById('ma').value='';document.getElementById('mb').value='';document.getElementById('mc').value='';
}

function cancelEdit(){ editKey=null; document.getElementById('a').value='';document.getElementById('b').value='';document.getElementById('c').value=''; }

// TimeLabel ko minute me convert karne ke liye - SORT FIX
function toMin(t){
  if(!t) return 0;
  let parts=t.split(' ');
  let tm=parts[0].split(':');
  let h=parseInt(tm[0]), m=parseInt(tm[1]), ap=parts[1];
  if(ap=='PM' && h!=12) h+=12;
  if(ap=='AM' && h==12) h=0;
  return h*60+m;
}

db.ref('results').on('value',s=>{
  let arr=[]; s.forEach(x=>{let r=x.val(); r._key=x.key; if((r.dateKey||dk(r.time))==dk(Date.now())) arr.push(r);});
  arr.sort((x,y)=>toMin(y.timeLabel)-toMin(x.timeLabel));
  let h=''; arr.forEach(r=>{ h+=`<tr><td>${r.timeLabel}</td><td>${p(r.a)}</td><td>${p(r.b)}</td><td>${p(r.c)}</td><td><button class="edit" onclick="startEdit('${r._key}',${r.a},${r.b},${r.c})">Edit</button></td></tr>`;});
  list.innerHTML=h;
});

function startEdit(key,a,b,c){
  editKey=key;
  document.getElementById('a').value=a; document.getElementById('b').value=b; document.getElementById('c').value=c;
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
