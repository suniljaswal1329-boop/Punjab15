<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punjab 15 Live Result</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:linear-gradient(180deg,#8b5cf6,#5b21b6);min-height:100vh;padding:15px;color:#fff}
h1{text-align:center;font-size:30px;margin-top:15px}.s{text-align:center;opacity:.85;font-size:14px;margin:5px 0 20px}
.c{background:#fff;color:#222;border-radius:28px;padding:25px 15px;max-width:480px;margin:auto;text-align:center}
.b{background:#7c3aed;color:#fff;padding:8px 22px;border-radius:20px;display:inline-block}
.balls{display:flex;justify-content:space-around;margin:25px 0}
.ball{width:95px;height:95px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#a78bfa,#4c1d95);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.l{margin-top:10px;color:#64748b;font-weight:700}.n{margin-top:25px;color:#64748b;font-size:13px;letter-spacing:1.5px}
.t{font-size:38px;font-weight:800;color:#1e1b4b;margin:5px 0 20px}.btn{background:#0f172a;color:#fff;border:0;padding:13px 25px;border-radius:25px}
.sec{max-width:480px;margin:20px auto 0}table{width:100%;background:#fff;color:#000;border-collapse:collapse;border-radius:10px;overflow:hidden;margin-top:10px}
th,td{padding:12px;text-align:center;border-bottom:1px solid #eee}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:15px}
.md.show{display:flex}.box{background:#fff;color:#000;width:100%;max-width:420px;border-radius:20px;padding:20px}
.box input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:8px 0}.box button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;margin-top:8px}
</style></head><body>
<h1>Punjab 15 Live Result</h1><p class="s">Result updates automatically at every interval</p>
<div class="c"><div class="b" id="rt">Result for --:--</div><div class="balls">
<div><div class="ball" id="a">--</div><div class="l">A</div></div>
<div><div class="ball" id="b">--</div><div class="l">B</div></div>
<div><div class="ball" id="c">--</div><div class="l">C</div></div></div>
<div class="n">NEXT RESULT IN</div><div class="t" id="tm">00:15:00</div>
<button class="btn" onclick="openS()">🗓️ Search Previous Dates</button></div>
<div class="sec"><h2>🕐 Today's Results</h2><table><thead><tr><th>Time</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody id="hist"></tbody></table></div>
<div class="md" id="md"><div class="box"><h3 style="text-align:center">Search Previous Results</h3>
<input type="date" id="d"><button style="background:#7c3aed;color:#fff" onclick="doS()">Search Result</button>
<div id="sr" style="margin-top:10px"></div><button onclick="closeS()">Close</button></div></div>
<script>
const cfg={apiKey:"AIzaSyAYINd0kww95bYvwRzjio8uabSuuXsLO1o",authDomain:"superlotto.firebaseapp.com",databaseURL:"https://superlotto-default-rtdb.firebaseio.com",projectId:"superlotto",storageBucket:"superlotto.firebasestorage.app",messagingSenderId:"851670105901",appId:"1:851670105901:web:568c45b226b7c80f1d1da4"};
firebase.initializeApp(cfg);let db=firebase.database(),all=[];
let dk=t=>{let d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let p=n=>String(n).padStart(2,'0');
db.ref('draw').on('value',s=>{let v=s.val();if(v&&v.winning){a.textContent=p(v.winning[0]);b.textContent=p(v.winning[1]);c.textContent=p(v.winning[2]);rt.textContent='Result for '+(v.timeLabel||'')}});
db.ref('results').on('value',s=>{all=[];s.forEach(x=>{let r=x.val();if(!r.dateKey)r.dateKey=dk(r.time);all.push(r)});show()});
function show(){let h='';all.filter(r=>r.dateKey==dk(Date.now())).reverse().forEach(r=>{h+=`<tr><td>${r.timeLabel}</td><td>${p(r.a)}</td><td>${p(r.b)}</td><td>${p(r.c)}</td></tr>`});hist.innerHTML=h||'<tr><td colspan="4">No results yet</td></tr>'}
function tick(){let n=new Date(),rem=(15-(n.getMinutes()%15))*60-n.getSeconds();tm.textContent='00:'+p(Math.floor(rem/60))+':'+p(rem%60)}setInterval(tick,1000);tick();
function openS(){md.classList.add('show');d.value=dk(Date.now());doS()}
function closeS(){md.classList.remove('show')}
function doS(){let v=d.value,arr=all.filter(r=>r.dateKey==v).reverse(),h='<table style="width:100%;border-collapse:collapse"><tr><th>Time</th><th>A</th><th>B</th><th>C</th></tr>';if(!arr.length)h+='<tr><td colspan="4" style="text-align:center;padding:10px">No result found</td></tr>';arr.forEach(r=>h+=`<tr><td style="padding:8px;text-align:center">${r.timeLabel}</td><td style="text-align:center">${p(r.a)}</td><td style="text-align:center">${p(r.b)}</td><td style="text-align:center">${p(r.c)}</td></tr>`);sr.innerHTML=h+'</table>'}
</script></body></html>
