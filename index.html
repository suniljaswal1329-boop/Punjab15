<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER LOTTO</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;font-family:Arial;padding:10px;color:#fff}
.header{text-align:center;padding:18px;border-radius:16px;border:2px solid #facc15;background:#000;margin-bottom:12px}
.header h1{font-family:'Righteous',cursive;font-size:36px;color:#facc15}
.timer,.live,.list,.search{background:#fff;color:#111;border-radius:16px;padding:14px;margin-bottom:12px;text-align:center}
.ball{display:inline-flex;width:54px;height:54px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-weight:900;font-size:22px;margin:5px}
.search input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;text-align:center;font-weight:700;font-size:15px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px;align-items:center}
</style>
</head>
<body>
<div class="header"><h1>SUPER LOTTO</h1><div style="font-size:12px;color:#aaa">PUNJAB STATE FAST RESULT (9AM-9PM)</div></div>
<div class="timer"><div style="font-size:12px;color:#666">NEXT DRAW IN</div><b id="timer" style="font-size:42px">00:00:00</b><div style="margin-top:6px">Next: <span id="slot">--:--</span> | <span id="date"></span></div></div>
<div class="live"><div style="font-size:12px;color:#666">LIVE RESULT</div><div id="liveDate" style="font-size:15px;margin:6px 0;font-weight:700">--</div><div id="liveBalls"></div></div>
<div class="search"><input id="searchBox" placeholder="Search History" onkeyup="doSearch()"></div>
<div class="list"><div style="text-align:left;font-weight:900;margin-bottom:10px">Today Results (15min) - <span id="count">0</span> draws</div><div id="history"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyBmWl4dDF4pXbdBZ-YVYLrYWrFgDYDbGCE",authDomain:"punjab15-1329.firebaseapp.com",databaseURL:"https://punjab15-1329-default-rtdb.firebaseio.com",projectId:"punjab15-1329",storageBucket:"punjab15-1329.firebasestorage.app",messagingSenderId:"586224821147",appId:"1:586224821147:web:d8f55f83372f5d6dd1773e"};
const app=initializeApp(cfg);const db=getDatabase(app);let allData=[];
function tick(){let now=new Date();let fixed=Math.floor(now.getMinutes()/15)*15;let d=new Date(now);d.setMinutes(fixed);d.setSeconds(0);let next=new Date(d);next.setMinutes(next.getMinutes()+15);let diff=Math.floor((next-now)/1000);if(diff<0)diff=0;let m=Math.floor(diff/60),s=diff%60;document.getElementById('timer').innerText="00:"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');let h=next.getHours(),ap=h>=12?'PM':'AM',hr=h%12||12,nm=next.getMinutes();document.getElementById('slot').innerText=String(hr).padStart(2,'0')+":"+String(nm).padStart(2,'0')+" "+ap.toLowerCase();document.getElementById('date').innerText=String(d.getDate()).padStart(2,'0')+"/"+String(d.getMonth()+1).padStart(2,'0')+"/"+d.getFullYear();}
setInterval(tick,1000);tick();
onValue(ref(db,'live/result'),snap=>{let v=snap.val();if(!v)return;document.getElementById('liveDate').innerText=v.date+" "+v.time;document.getElementById('liveBalls').innerHTML=`<span class="ball" style="background:#ef4444">${v.a}</span><span class="ball" style="background:#a855f7">${v.b}</span><span class="ball" style="background:#22c55e">${v.c}</span>`;});
onValue(ref(db,'history'),snap=>{allData=[];snap.forEach(c=>allData.push(c.val()));allData.sort((x,y)=>y.timestamp-x.timestamp);render(allData);});
window.render=(list)=>{let h=document.getElementById('history');h.innerHTML="";document.getElementById('count').innerText=list.length;list.forEach(r=>{h.innerHTML+=`<div class="row"><div>${r.date} ${r.time}</div><div><span class="ball" style="background:#ef4444;width:34px;height:34px;font-size:14px">${r.a}</span><span class="ball" style="background:#a855f7;width:34px;height:34px;font-size:14px">${r.b}</span><span class="ball" style="background:#22c55e;width:34px;height:34px;font-size:14px">${r.c}</span></div></div>`;});};
window.doSearch=()=>{let q=document.getElementById('searchBox').value.toLowerCase();if(!q)return render(allData);let f=allData.filter(r=>(r.date+r.time+r.a+r.b+r.c).toLowerCase().includes(q));render(f);};
</script>
</body>
</html>
