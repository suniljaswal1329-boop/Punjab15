<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjab 15 Live Result</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:linear-gradient(180deg,#8b5cf6,#6d28d9 45%,#4c1d95);min-height:100vh;padding:15px;color:#fff}
h1{text-align:center;font-size:30px;margin-top:15px;font-weight:700}
.sub{text-align:center;opacity:.85;font-size:14px;margin:6px 0 20px}
.card{background:#fff;color:#1e293b;border-radius:28px;padding:25px 15px 28px;max-width:480px;margin:0 auto;text-align:center;box-shadow:0 15px 35px rgba(0,0,0,.3)}
.badge{background:#7c3aed;color:#fff;display:inline-block;padding:9px 24px;border-radius:20px;font-size:16px}
.balls{display:flex;justify-content:space-around;margin:28px 0 5px}
.ball{width:95px;height:95px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#a78bfa,#7c3aed 55%,#4c1d95);color:#fff;font-size:31px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 25px rgba(124,58,237,.45)}
.label{margin-top:11px;color:#64748b;font-weight:700;font-size:18px}
.next{margin-top:28px;color:#64748b;font-size:13px;letter-spacing:1.8px}
.timer{font-size:40px;font-weight:800;color:#1e1b4b;margin:5px 0 22px;letter-spacing:1px}
.btn{background:#0f172a;color:#fff;border:0;padding:13px 26px;border-radius:25px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.sec{max-width:480px;margin:24px auto 0}
.sec h2{font-size:22px;display:flex;align-items:center;gap:6px}
table{width:100%;background:#fff;color:#000;border-collapse:collapse;border-radius:10px;overflow:hidden;margin-top:12px}
th,td{padding:13px 8px;text-align:center;font-size:16px;border-bottom:1px solid #eee}
th{background:#f8fafc;font-weight:700}
.num{border:1px solid #ddd;padding:4px 11px;border-radius:8px;display:inline-block;background:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:15px}
.modal.show{display:flex}
.modalBox{background:#fff;color:#000;width:100%;max-width:420px;border-radius:20px;padding:20px;max-height:85vh;overflow:auto}
.modalBox h3{margin-bottom:12px;text-align:center}
.modalBox input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:8px 0;font-size:16px}
.modalBox button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer;margin-top:8px}
.searchBtn{background:#7c3aed;color:#fff}.closeBtn{background:#e2e8f0}
@media(max-width:420px){.ball{width:85px;height:85px;font-size:27px}.timer{font-size:34px}}
</style>
</head>
<body>
<h1>Punjab 15 Live Result</h1>
<p class="sub">Result updates automatically at every interval</p>

<div class="card">
<div class="badge" id="rt">Result for --:--</div>
<div class="balls">
<div><div class="ball" id="a">--</div><div class="label">A</div></div>
<div><div class="ball" id="b">--</div><div class="label">B</div></div>
<div><div class="ball" id="c">--</div><div class="label">C</div></div>
</div>
<div class="next">NEXT RESULT IN</div>
<div class="timer" id="cd">00:15:00</div>
<button class="btn" onclick="openSearch()">🗓️ Search Previous Dates</button>
</div>

<div class="sec">
<h2>🕐 Today's Results</h2>
<table><thead><tr><th>Time</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody id="hist"></tbody></table>
</div>

<div class="modal" id="modal"><div class="modalBox">
<h3>🔍 Search Previous Results</h3>
<label>Select Date</label>
<input type="date" id="searchDate">
<button class="searchBtn" onclick="doSearch()">Search Result</button>
<div id="searchResult" style="margin-top:12px"></div>
<button class="closeBtn" onclick="closeSearch()">Close</button>
</div></div>
