<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Punjab15 Live</title>
<style>body{font-family:Arial;background:#eef3ff;margin:0;padding:15px;display:flex;justify-content:center}.box{width:100%;max-width:400px;background:white;border-radius:18px;padding:22px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,0.1);border-top:5px solid #0d47a1}.timer{font-size:58px;font-weight:900;color:#d32f2f;margin:15px 0}.result-box{background:#0d47a1;color:white;border-radius:12px;padding:16px}.result{font-size:36px;font-weight:bold;letter-spacing:4px}.closed{color:#d32f2f;font-weight:bold;font-size:20px}</style></head><body>
<div class="box"><h2 style="color:#0d47a1">PUNJAB15 LIVE</h2><p id="status">Next Result In</p><div class="timer" id="timer">00:00</div><div class="result-box"><div>LATEST RESULT</div><div class="result" id="res">WAIT</div><div id="tlabel" style="font-size:12px;margin-top:5px"></div></div><p style="font-size:12px;color:gray;margin-top:15px">Market Time: 9 AM to 9 PM</p></div>
<script>
const DB_URL="https://punjab15-1329-default-rtdb.firebaseio.com/result.json";
async function fetchResult(){try{let r=await fetch(DB_URL);let d=await r.json();if(d&&d.result){document.getElementById('res').innerText=d.result;document.getElementById('tlabel').innerText=d.time||""}}catch(e){}}

function getNextSlot(){
  let now=new Date(); let next=new Date(now); next.setSeconds(0,0);
  let h=now.getHours();
  // Raat 9 ke baad ya subah 9 se pehle
  if(h>=21){ next.setDate(now.getDate()+1); next.setHours(9,0,0,0); return next; }
  if(h<9){ next.setHours(9,0,0,0); return next; }
  // Din me 15-15 min ka slot
  let m=now.getMinutes(); let nextM=Math.ceil((m+now.getSeconds()/60)/15)*15;
  if(nextM>=60){ next.setHours(h+1); next.setMinutes(0); }else{ next.setMinutes(nextM); }
  // Agar next slot 9 PM se zyada ho gaya to kal subah 9 baje
  if(next.getHours()>=21){ next.setDate(next.getDate()+1); next.setHours(9,0,0,0); }
  return next;
}

let nextSlot=getNextSlot();
function updateTimer(){
  let now=new Date();
  let h=now.getHours();
  // Market band hai
  if(h>=21 || h<9){
    document.getElementById('status').innerText="Market Closed";
    document.getElementById('status').className="closed";
    document.getElementById('timer').innerText="09:00 AM";
    document.getElementById('timer').style.fontSize="28px";
    return;
  }
  document.getElementById('status').innerText="Next Result In";
  document.getElementById('status').className="";
  document.getElementById('timer').style.fontSize="58px";
  let diff=nextSlot-now;
  if(diff<=0){ nextSlot=getNextSlot(); fetchResult(); return; }
  let mm=Math.floor(diff/60000); let ss=Math.floor((diff%60000)/1000);
  document.getElementById('timer').innerText=(mm<10?'0':'')+mm+":"+(ss<10?'0':'')+ss;
}
setInterval(updateTimer,1000);
setInterval(fetchResult,3000);
fetchResult(); updateTimer();
</script></body></html>
