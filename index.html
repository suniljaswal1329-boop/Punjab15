<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjab 15 - SuperLotto</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:15px;text-align:center}
h1{color:#facc15}.card{background:#1e293b;padding:20px;border-radius:16px;max-width:420px;margin:15px auto;text-align:left}
input{width:100%;padding:12px;border-radius:10px;border:0;margin:6px 0;font-size:15px}
button{background:#facc15;border:0;padding:13px;border-radius:10px;font-weight:800;width:100%;cursor:pointer;font-size:16px}
.nums{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}
.n{width:42px;height:42px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
.n.sel{background:#facc15;color:#000;transform:scale(1.1)}
#winning{font-size:26px;font-weight:900;color:#facc15}
.live{color:#22c55e;font-weight:800}
.ticket{background:#0f172a;padding:10px;border-radius:10px;margin:6px 0}
</style>
</head>
<body>
<h1>🎰 Punjab 15 SuperLotto</h1>
<p>Pick 6 Numbers - Win Big!</p>

<div class="card">
<h3>🔴 Live Draw</h3>
<p>Status: <span id="status" class="live">Connecting...</span></p>
<div id="winning">- - - - - -</div>
<p id="drawTime" style="font-size:12px;color:#94a3b8"></p>
</div>

<div class="card">
<h3>🎟️ Buy Ticket - ₹10</h3>
<p>Pick 6 Numbers:</p>
<div class="nums" id="grid"></div>
<p>Selected: <b id="selCount">0 / 6</b></p>
<input id="name" placeholder="Your Name *">
<input id="phone" placeholder="Phone Number">
<button onclick="buyTicket()">Buy Ticket</button>
<p id="msg" style="color:#22c55e"></p>
</div>

<div class="card">
<h3>📋 Recent Tickets</h3>
<div id="tickets">Loading...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAYINd0kww95bYvwRzjio8uabSuuXsLO1o",
  authDomain: "superlotto.firebaseapp.com",
  databaseURL: "https://superlotto-default-rtdb.firebaseio.com",
  projectId: "superlotto",
  storageBucket: "superlotto.firebasestorage.app",
  messagingSenderId: "851670105901",
  appId: "1:851670105901:web:568c45b226b7c80f1d1da4",
  measurementId: "G-9B7HEFN16J"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let sel = [];
const grid = document.getElementById('grid');
for(let i=1;i<=49;i++){
  let d=document.createElement('div'); d.className='n'; d.textContent=i;
  d.onclick=()=>{
    if(sel.includes(i)){ sel=sel.filter(x=>x!==i); d.classList.remove('sel'); }
    else if(sel.length<6){ sel.push(i); d.classList.add('sel'); }
    else alert('Only 6 numbers!');
    document.getElementById('selCount').textContent = sel.length+' / 6';
  };
  grid.appendChild(d);
}
db.ref('draw').on('value', s=>{
  let v=s.val()||{};
  document.getElementById('status').textContent = v.status || 'Waiting For Draw';
  if(v.winning) document.getElementById('winning').textContent = v.winning.join(' - ');
  document.getElementById('drawTime').textContent = v.time ? new Date(v.time).toLocaleString() : '';
});
function buyTicket(){
  if(sel.length!==6) return alert('Please pick 6 numbers');
  const name=document.getElementById('name').value.trim();
  if(!name) return alert('Enter Name');
  db.ref('tickets').push({name, phone:document.getElementById('phone').value, numbers:sel.sort((a,b)=>a-b), status:'pending', time:Date.now()}).then(()=>{
    document.getElementById('msg').textContent='✅ Ticket Booked! Good Luck '+name;
    sel=[]; document.querySelectorAll('.n').forEach(e=>e.classList.remove('sel')); document.getElementById('selCount').textContent='0 / 6';
  });
}
db.ref('tickets').limitToLast(10).on('value', s=>{
  let h=''; s.forEach(c=>{ let t=c.val(); h='<div class="ticket">🎫 '+t.name+' - '+t.numbers.join(', ')+' - <b>'+t.status+'</b></div>'+h; });
  document.getElementById('tickets').innerHTML = h || 'No tickets yet';
});
</script>
</body>
</html>
