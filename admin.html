<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - SUPER LOTTO</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#111;font-family:Arial;padding:12px;color:#fff}
.header{text-align:center;padding:16px;border-radius:14px;border:2px solid #facc15;background:#000;margin-bottom:12px}
.header h1{font-family:'Righteous',cursive;font-size:36px;background:linear-gradient(#fde047,#facc15,#eab308);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.card{background:#fff;color:#111;border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin-bottom:8px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:18px;text-align:center;font-weight:900;margin-bottom:8px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:900;font-size:16px;cursor:pointer}
.save{background:#111;color:#facc15}.del{background:#ef4444;color:#fff;margin-top:8px}
.grid{display:flex;gap:8px}.grid input{flex:1}
.list{background:#fff;color:#111;border-radius:14px;padding:10px}
.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
.badge{display:flex;gap:5px}.badge i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:900;font-size:11px}
</style>
</head>
<body>
<div class="header"><h1>SUPER LOTTO</h1><p style="color:#aaa;font-size:11px">ADMIN PANEL</p></div>

<div class="card">
<h3>Live Result (A B C)</h3>
<div class="grid"><input id="a" placeholder="A"><input id="b" placeholder="B"><input id="c" placeholder="C"></div>
<div style="font-size:12px;color:#666;margin:6px 0">Next slot: <b id="slot">--:-- --</b></div>
<button class="btn save" onclick="saveLive()">SAVE RESULT (Auto 15min Slot)</button>
<button class="btn del" onclick="deleteAll()">DELETE ALL HISTORY</button>
</div>

<div class="list" id="history"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,set,remove,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyBmWl4dDF4pXbdBZ-YVYLrYWrFgDYDbGCE",authDomain:"punjab15-1329.firebaseapp.com",databaseURL:"https://punjab15-1329-default-rtdb.firebaseio.com",projectId:"punjab15-1329",storageBucket:"punjab15-1329.firebasestorage.app",messagingSenderId:"586224821147",appId:"1:586224821147:web:d8f55f83372f5d6dd1773e"};
const app=initializeApp(cfg),db=getDatabase(app);

function getSlot(){
 let n=new Date(); let m=n.getMinutes(); let slot=Math.floor(m/15)*15;
 let d=new Date(n); d.setMinutes(slot); d.setSeconds(0);
 let h=d.getHours(); let ap=h>=12?'PM':'AM'; let hr=h%12||12;
 let timeStr=String(hr).padStart(2,'0')+":"+String(slot).padStart(2,'0')+" "+ap.toLowerCase();
 let dateStr=String(d.getDate()).padStart(2,'0')+"/"+String(d.getMonth()+1).padStart(2,'0')+"/"+d.getFullYear();
 return {dateStr,timeStr,slot,hour:h,fullDate:d};
}

function updateSlot(){
 let s=getSlot(); document.getElementById('slot').innerText=s.timeStr+" | "+s.dateStr;
}
setInterval(updateSlot,1000); updateSlot();

window.saveLive=async()=>{
 let a=document.getElementById('a').value.trim();
 let b=document.getElementById('b').value.trim();
 let c=document.getElementById('c').value.trim();
 if(!a||!b||!c)return alert("A B C bharo");
 let s=getSlot();
 if(s.hour<9||s.hour>=21)return alert("Result sirf 9AM to 9PM allowed hai!");
 let key=s.dateStr.replaceAll("/","-")+"_"+s.timeStr.replaceAll(" ","").replaceAll(":","-");
 await set(ref(db,'live/result'),{a,b,c,date:s.dateStr,time:s.timeStr,timestamp:Date.now()});
 await set(ref(db,'history/'+key),{a,b,c,date:s.dateStr,time:s.timeStr,timestamp:Date.now()});
 alert("Saved as "+s.timeStr); document.getElementById('a').value="";document.getElementById('b').value="";document.getElementById('c').value="";
};

window.deleteAll=async()=>{if(!confirm("Saara history delete karna hai?"))return; await remove(ref(db,'history')); alert("Deleted");};

onValue(ref(db,'history'),snap=>{
 let h=document.getElementById('history'); h.innerHTML="<b>History (9AM-9PM only)</b><br><br>";
 let arr=[]; snap.forEach(c=>arr.push(c.val()));
 arr.sort((x,y)=>y.timestamp-x.timestamp);
 arr.forEach(r=>{
   let t=(r.time||"").toLowerCase(); let m=t.match(/(\d+):(\d+)\s*(am|pm)/); if(m){
     let hr=parseInt(m[1]); if(m[3]=='pm'&&hr!=12)hr+=12; if(m[3]=='am'&&hr==12)hr=0; if(hr<9||hr>=21)return;
   }
   h.innerHTML+=`<div class="item"><div>${r.date} ${r.time}</div><div class="badge"><i style="background:#ef4444">${r.a}</i><i style="background:#a855f7">${r.b}</i><i style="background:#22c55e">${r.c}</i></div></div>`;
 });
});
</script>
</body>
</html>
