<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjab15 - Live Result</title>
<style>
body{font-family:Arial;background:#eef3ff;margin:0;padding:15px;display:flex;justify-content:center}
.box{width:100%;max-width:400px;background:white;border-radius:18px;padding:22px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,0.1);border-top:5px solid #0d47a1}
.timer{font-size:64px;font-weight:900;color:#d32f2f;margin:15px 0}
.result-box{background:#0d47a1;color:white;border-radius:12px;padding:16px}
.result{font-size:36px;font-weight:bold;letter-spacing:4px}
.btn{margin-top:15px;background:#2e7d32;color:white;border:none;width:100%;padding:13px;border-radius:10px;font-size:18px}
</style>
</head>
<body>
<div class="box">
<h2 style="color:#0d47a1">PUNJAB15 LIVE</h2>
<p>Next Result In</p>
<div class="timer" id="timer">00:00</div>
<div class="result-box">
<div>LATEST RESULT</div>
<div class="result" id="res">WAIT</div>
<div id="tlabel" style="font-size:12px;margin-top:5px"></div>
</div>
<button class="btn" onclick="location.reload()">Refresh</button>
<p style="font-size:11px;color:gray">Har 15 min (00,15,30,45) par result change. Sabke phone me same time.</p>
</div>
<script>
function getNextSlot(){
  let now=new Date();
  let next=new Date(now);
  next.setSeconds(0,0);
  let m=now.getMinutes();
  let nextM=Math.ceil((m+now.getSeconds()/60)/15)*15;
  if(nextM>=60){next.setHours(now.getHours()+1);next.setMinutes(0);}
  else{next.setMinutes(nextM);}
  return next;
}
let nextSlot=getNextSlot();
function updateTimer(){
  let now=new Date();
  let diff=nextSlot-now;
  if(diff<=0){
    document.getElementById('res').innerText=Math.floor(1000+Math.random()*9000);
    document.getElementById('tlabel').innerText="Updated: "+now.toLocaleTimeString();
    nextSlot=getNextSlot(); return;
  }
  let mm=Math.floor(diff/60000);
  let ss=Math.floor((diff%60000)/1000);
  document.getElementById('timer').innerText=(mm<10?'0':'')+mm+":"+(ss<10?'0':'')+ss;
}
setInterval(updateTimer,1000); updateTimer();
</script>
</body>
</html>
