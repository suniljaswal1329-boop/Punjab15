<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Punjab15</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{font-family:Arial;background:#111;color:#fff;padding:20px}button{padding:12px;margin:5px;border:0;border-radius:8px;font-weight:700;cursor:pointer} .green{background:#22c55e}.yellow{background:#facc15}.red{background:#ef4444;color:#fff}.card{background:#222;padding:15px;border-radius:12px;margin:10px 0}</style></head>
<body>
<h1>Admin Panel - Punjab 15</h1>
<button class="green" onclick="startDraw()">Start Draw</button>
<button class="yellow" onclick="doDraw()">🎲 Random Draw</button>
<button class="red" onclick="endDraw()">End Draw</button>
<h2 id="res" style="font-size:28px;color:#facc15"></h2>
<div class="card"><h3>All Tickets</h3><div id="list"></div></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAYINd0kww95bYvwRzjio8uabSuuXsLO1o",
  authDomain: "superlotto.firebaseapp.com",
  databaseURL: "https://superlotto-default-rtdb.firebaseio.com",
  projectId: "superlotto",
  storageBucket: "superlotto.firebasestorage.app",
  messagingSenderId: "851670105901",
  appId: "1:851670105901:web:568c45b226b7c80f1d1da4",
  measurementId: "G-9B7HEFN16J"
};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
function startDraw(){ db.ref('draw').set({status:'LIVE - Buying Open', winning:null, time:Date.now()}); alert('Draw Started'); }
function endDraw(){ db.ref('draw/status').set('Draw Closed'); }
function doDraw(){
  let n=new Set(); while(n.size<6) n.add(Math.floor(Math.random()*49)+1);
  let a=[...n]; document.getElementById('res').textContent = 'Winning: '+a.join(' - ');
  db.ref('draw').update({winning:a, status:'Result Declared', time:Date.now()});
}
db.ref('tickets').on('value', s=>{
  let h=''; s.forEach(c=>{ let t=c.val(); h+='<div style="margin:8px 0">'+t.name+' | '+t.numbers.join(',')+' | '+t.status+' <button onclick="approve(\''+c.key+'\')">Approve</button> <button onclick="delTicket(\''+c.key+'\')" style="background:#ef4444;color:#fff">Delete</button></div>'; });
  document.getElementById('list').innerHTML = h || 'No tickets';
});
function approve(k){ db.ref('tickets/'+k+'/status').set('approved'); }
function delTicket(k){ if(confirm('Delete?')) db.ref('tickets/'+k).remove(); }
</script>
</body></html>
