<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperLotto Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#f2f2f2;padding:15px;margin:0}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px}
input,select{padding:10px;margin:5px 0;width:90px}
.btn{background:#007bff;color:#fff;border:0;padding:10px 15px;border-radius:8px;cursor:pointer}
.btn-green{background:green}
.auto{font-size:18px;font-weight:bold;margin:10px 0}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
</style></head><body>
<h1>SuperLotto Admin</h1>

<div class="card">
<h2>New Result Publish</h2>
<div class="auto" id="autoTime">Auto Time: --</div>
<input id="a" placeholder="A" type="number">
<input id="b" placeholder="B" type="number">
<input id="c" placeholder="C" type="number">
<br><button class="btn" onclick="publish()">Publish</button>
<button class="btn" onclick="cancelEdit()">Cancel Edit</button>
</div>

<div class="card" style="border:2px dashed #888">
<h2>⏰ Missed Result Add Karo</h2>
<p style="color:#555;font-size:14px">Jo time chhoot gaya ho wo yahan se daalo</p>
<select id="missTime"></select>
<br>
<input id="ma" placeholder="A" type="number">
<input id="mb" placeholder="B" type="number">
<input id="mc" placeholder="C" type="number">
<br><button class="btn btn-green" onclick="addMissed()">Add Missed Result</button>
</div>

<div class="card">
<h2>Today's Results - Edit</h2>
<table><tr><th>Time</th><th>A</th><th>B</th><th>C</th><th>Action</th></tr><tbody id="list"></tbody></table>
</div>

<script>
// === APNA PURANA CONFIG YAHAN DAALO - line 41 wala ===
const cfg={apiKey:"AIzaSyAYINd0kww95bYvwRzjio8uabSuuXsLO1o",authDomain:"superlotto.firebaseapp.com",databaseURL:"https://superlotto-default-rtdb.firebaseio.com",projectId:"superlotto",storageBucket:"superlotto.firebasestorage.app",messagingSenderId:"851670105901",appId:"1:851670105901:web:568c45b226b7c80f1d1da4"};
firebase.initializeApp(cfg);let db=firebase.database();
let p=n=>String(n).padStart(2,'0');
let dk=t=>{let d=new Date(t);return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
let format12=(h,m)=>{let ap=h>=12?'PM':'AM';let hh=h%12||12;return hh+':'+p(m)+' '+ap};
let editKey=null;

// ==== SIRF YE FUNCTION CHANGE HUA HAI = floor wala ====
function calcAuto(){
  let t=new Date();
  t.setMinutes(Math.floor(t.getMinutes()/15)*15,0,0);
  return format12(t.getHours(),t.getMinutes());
}
autoTime.textContent='Auto Time: '+calcAuto();
setInterval(()=>autoTime.textContent='Auto Time: '+calcAuto(),1000);

// Missed Time Dropdown - 8:45 AM to 10:00 PM
let sel=document.getElementById('missTime');
for(let h=8;h<=22;h++){
  for(let m=0;m<60;m+=15){
    if(h==8 && m<45) continue; if(h==22 && m>0) continue;
    let label=format12(h,m);
    let opt=document.createElement('option');opt.value=label;opt.textContent=label;sel.appendChild(opt);
  }
}
sel.value=calcAuto();

function publish(){
  let A=+a.value,B=+b.value,C=+c.value;
  if(isNaN(A)||isNaN(B)||isNaN(C)) return alert('3 number daalo');
  let t=new Date(); t.setMinutes(Math.floor(t.getMinutes()/15)*15,0,0);
  let lb=format12(t.getHours(),t.getMinutes());
  if(editKey){
    db.ref('results/'+editKey).update({a:A,b:B,c:C});
    db.ref('draw').set({a:A,b:B,c:C,time:t.getTime(),timeLabel:lb,dateKey:dk(t.getTime())});
    editKey=null; alert('Edited: '+lb);
  } else {
    db.ref('draw').set({a:A,b:B,c:C,time:t.getTime(),timeLabel:lb,dateKey:dk(t.getTime())});
    db.ref('results').push({a:A,b:B,c:C,time:t.getTime(),timeLabel:lb,dateKey:dk(t.getTime())});
  }
  a.value=b.value=c.value='';
}
function cancelEdit(){editKey=null;a.value=b.value=c.value='';}
function addMissed(){
  let A=+ma.value,B=+mb.value,C=+mc.value;
  if(isNaN(A)||isNaN(B)||isNaN(C)) return alert('3 number daalo');
  let lb=missTime.value;
  let now=new Date();
  let h=parseInt(lb.split(':')[0]);let m=parseInt(lb.split(':')[1].split(' ')[0]);let isPM=lb.includes('PM');
  if(isPM&&h!=12)h+=12; if(!isPM&&h==12)h=0;
  let t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);
  db.ref('results').push({a:A,b:B,c:C,time:t.getTime(),timeLabel:lb,dateKey:dk(t.getTime())});
  alert('Missed Added: '+lb);
  ma.value=mb.value=mc.value='';
}
function editRes(k,r){editKey=k;a.value=r.a;b.value=r.b;c.value=r.c;window.scrollTo(0,0);alert('Edit Mode: '+r.timeLabel);}
function delRes(k){if(confirm('Delete?')) db.ref('results/'+k).remove();}

// Today's list
let today=dk(Date.now());
db.ref('results').orderByChild('dateKey').equalTo(today).on('value',s=>{
  let h='';s.forEach(x=>{let r=x.val();h=`<tr><td>${r.timeLabel}</td><td>${r.a}</td><td>${r.b}</td><td>${r.c}</td><td><button onclick="editRes('${x.key}',${JSON.stringify(r).replace(/"/g,'&quot;')})">Edit</button> <button onclick="delRes('${x.key}')">Del</button></td></tr>`+h});
  list.innerHTML=h;
});
</script>
</body></html>
