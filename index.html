<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER LOTTO - Fast Result</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}
.hdr{text-align:center;background:#000;border:2px solid #facc15;border-radius:14px;padding:14px;margin-bottom:10px}
.hdr h1{font-family:'Righteous',cursive;font-size:38px;color:#facc15}
.timer{background:#fff;color:#111;border-radius:12px;padding:10px;text-align:center;margin-bottom:10px}
.timer b{font-size:32px}
.live{background:#fff;color:#111;border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}
.balls{display:flex;justify-content:center;gap:12px;margin-top:10px}
.ball{width:65px;height:65px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#fff}
.a{background:#ef4444}.b{background:#a855f7}.c{background:#22c55e}
.refresh{width:100%;padding:14px;border-radius:12px;border:2px solid #facc15;background:#111;color:#facc15;font-weight:900;font-size:16px;cursor:pointer;margin-bottom:10px}
.refresh:active{transform:scale(0.97)}
.hist{background:#fff;color:#111;border-radius:14px;padding:10px}
.row{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #eee;font-size:13px}
.badge{display:flex;gap:6px}.badge i{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:900;font-size:11px}
</style>
</head>
<body>
<div class="hdr"><h1>SUPER LOTTO</h1><div style="font-size:11px;color:#aaa">PUNJAB STATE FAST RESULT (9AM-9PM)</div></div>
<div class="timer"><div style="font-size:12px">NEXT DRAW IN</div><b id="timer">00:00:00</b><div style="font-size:12px;margin-top:4px">Next: <span id="slot">--:--</span> | <span id="date"></span></div></div>
<div class="live">
<div style="font-size:12px;color:#666">LIVE RESULT</div>
<div style="font-size:13px;margin-top:4px"><span id="live-date">--/--/----</span> <span id="live-time">--:--</span></div>
<div class="balls"><div class="ball a" id="live-a">-</div><div class="ball b" id="live-b">-</div><div class="ball c" id="live-c">-</div></div>
</div>
<button class="refresh" id="refBtn" onclick="refreshResult()">🔄 REFRESH RESULT</button>
<div class="hist" id="history">Loading...</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyBmWl4dDF4pXbdBZ-YVYLrYWrFgDYDbGCE",authDomain:"punjab15-1329.firebaseapp.com",databaseURL:"https://punjab15-1329-default-rtdb.firebaseio.com",projectId:"punjab15-1329",storageBucket:"punjab15-1329.firebasestorage.app",messagingSenderId:"586224821147",appId:"1:586224821147:web:d8f55f83372f5d6dd1773e"};
const app=initializeApp(cfg),db=getDatabase(app);

function getSlot(){
 let now=new Date(); let fixed=Math.floor(now.getMinutes()/15)*15;
 let d=new Date(now); d.setMinutes(fixed); d.setSeconds(0);
 return {now,d,fixed};
}
function tick(){
 let s=getSlot(); let next=new Date(s.d); next.setMinutes(next.getMinutes()+15);
 let diff=Math.floor((next-s.now)/1000); if(diff<0)diff=0;
 let m=Math.floor(diff/60),sec=diff%60;
 document.getElementById('timer').innerText="00:"+String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
 let h=s.d.getHours(); let ap=h>=12?'PM':'AM'; let hr=h%12||12;
 document.getElementById('slot').innerText=String(hr).padStart(2,'0')+":"+String(s.fixed).padStart(2,'0')+" "+ap.toLowerCase();
 document.getElementById('date').innerText=String(s.d.getDate()).padStart(2,'0')+"/"+String(s.d.getMonth()+1).padStart(2,'0')+"/"+s.d.getFullYear();
}
setInterval(tick,1000); tick();

function showLive(r){
 document.getElementById('live-a').innerText=""; document.getElementById('live-b').innerText=""; document.getElementById('live-c').innerText="";
 setTimeout(()=>{
  document.getElementById('live-date').innerText=r.date; document.getElementById('live-time').innerText=r.time;
  document.getElementById('live-a').innerText=r.a; document.getElementById('live-b').innerText=r.b; document.getElementById('live-c').innerText=r.c;
 },100);
}
onValue(ref(db,'live/result'),snap=>{ if(snap.exists()) showLive(snap.val()); });
onValue(ref(db,'history'),snap=>{
 let h=document.getElementById('history'); h.innerHTML="<b>Today Results (15min)</b><br><br>";
 let arr=[]; snap.forEach(c=>arr.push(c.val())); arr.sort((x,y)=>y.timestamp-x.timestamp);
 arr.forEach(r=>{ h.innerHTML+=`<div class="row"><div>${r.date} ${r.time}</div><div class="badge"><i style="background:#ef4444">${r.a}</i><i style="background:#a855f7">${r.b}</i><i style="background:#22c55e">${r.c}</i></div></div>`; });
});
window.refreshResult=async()=>{
 let btn=document.getElementById('refBtn'); btn.innerText="⏳ LOADING...";
 let snap=await get(ref(db,'live/result')); if(snap.exists()) showLive(snap.val());
 setTimeout(()=>{btn.innerText="🔄 REFRESH RESULT";},800);
}
</script>
</body>
</html>
